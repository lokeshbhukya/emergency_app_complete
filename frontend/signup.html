<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signup</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h2>Signup</h2>
  <form id="signup-form">
    <input type="text" id="name" placeholder="Name" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="text" id="phone" placeholder="Phone" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Signup</button>
  </form>
  <p>Already have an account? <a id="login-link">Log in here</a></p>

  <script>
    const type = new URLSearchParams(window.location.search).get("type");
    document.getElementById("login-link").href = "login.html?type=" + type;

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      const password = document.getElementById("password").value;

      const res = await fetch("http://localhost:4000/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, phone, password, type }),
      });
      const data = await res.json();
      if (data.success) {
        alert("Signup successful!");
        location.href = "login.html?type=" + type;
      } else {
        alert(data.message);
      }
    });
  </script>
</body>
</html>
