<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h2>Login</h2>
  <form id="login-form">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>
  <p>Don't have an account? <a id="signup-link">Sign up here</a></p>

  <script>
    const type = new URLSearchParams(window.location.search).get("type");
    if (!type) {
      alert("Missing user type in URL. Use '?type=customer' or '?type=driver'");
    }
    document.getElementById("signup-link").href = "signup.html?type=" + type;

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("https://emergency-app-complete-6.onrender.com/login", { // Updated URL
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, type }),
        });

        if (!res.ok) throw new Error("Server error");

        const data = await res.json();
        if (data.success) {
          localStorage.setItem(type === "driver" ? "driver" : "user", JSON.stringify(data.user));
          window.location.href = type === "driver" ? "driver-dashboard.html" : "customer-dashboard.html";
        } else {
          alert(data.message || "Login failed");
        }
      } catch (err) {
        console.error(err);
        alert("Unable to reach server. Is it running?");
      }
    });
  </script>
</body>
</html>
